<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Gestión de Asesores - Isósceles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="src/iconoCASA.ico">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
:root {
            --naranja-isosceles: #FF6600;
            --negro-isosceles: #1A1A1A;
        }
        body {
            position: relative;
            background-color: #f8f9fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('src/LOGOORIGINAL.png');
            background-repeat: repeat;
            background-size: 150px;
            opacity: 0.1;
        }
        .btn-primary {
            background-color: var(--naranja-isosceles) !important;
            border-color: var(--naranja-isosceles) !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">👥 Gestión de Asesores y Accesos</h2>
        <a href="index.html" class="btn btn-secondary">Volver al Panel</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Registrar Nuevo Asesor</h5>
            <form id="formEmpleado" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="emp_nombre" class="form-control" placeholder="Nombre completo" required>
                </div>
                <div class="col-md-3">
                    <input type="email" id="emp_email" class="form-control" placeholder="Email (será su usuario)" required>
                </div>
                <div class="col-md-2">
                    <input type="password" id="emp_pass" class="form-control" placeholder="Contraseña inicial" required>
                </div>
                <div class="col-md-2">
                    <div class="input-group">
                        <input type="text" id="emp_tel_input" class="form-control" placeholder="Teléfono">
                        <button type="button" class="btn btn-outline-secondary" onclick="agregarTelALista()">+</button>
                    </div>
                    <div id="lista_tels_previa" class="mt-2 small text-muted"></div>
                </div>
                <div class="col-md-2">
                    <button type="submit" id="btnGuardar" class="btn btn-primary w-100">Crear Acceso</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-white table-hover shadow-sm">
            <thead class="table-dark">
                <tr><th>Nombre</th><th>Email / Usuario</th><th>Teléfonos</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista-empleados"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { getFirestore, updateDoc,collection, onSnapshot, doc, getDoc, deleteDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserSessionPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import { auth, db, crearAuthSecundaria } from "./js/firebase.js";


const secondaryAuth = crearAuthSecundaria();

setPersistence(secondaryAuth, inMemoryPersistence);

let registrandoEmpleado = false;

    // Seguridad: Solo el Admin debería estar aquí
    onAuthStateChanged(auth, async (user) => {

    // Si estamos en medio de un proceso de registro, ignoramos los cambios de auth
    if (registrandoEmpleado) return;

    if (!user) {
        window.location.href = 'login.html';
        return;
    }

    try {
        const userDoc = await getDoc(doc(db, "empleados", user.uid));
        if (userDoc.exists() && userDoc.data().rol === "admin") {
            document.body.style.display = 'block';
            iniciarEscuchaEmpleados(); 
        } else {
            window.location.href = 'vistaEmpleado.html';
        }
    } catch (error) {
        console.error("Error de seguridad:", error);
        window.location.href = 'login.html';
    }
});


function iniciarEscuchaEmpleados() {
    // Cargar Empleados en tiempo real
    onSnapshot(collection(db, "empleados"), (snapshot) => {
        const lista = document.getElementById('lista-empleados');
        lista.innerHTML = '';
        snapshot.forEach(docSnap => {
            const e = docSnap.data();
            const listaTels = e.telefonos ? e.telefonos.join(', ') : 'Sin teléfono';

            lista.innerHTML += `
        <tr>
            <td><strong>${e.nombre}</strong></td>
            <td>${e.email}</td>
            <td>
                <button class="btn btn-sm btn-light border" onclick="verTelefonos('${e.nombre}', '${listaTels}')">📱 Ver telefonos</button>
            </td>
            <td>
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-primary" onclick="editarTelefonos('${docSnap.id}', '${e.nombre}')">✏️ Editar</button>
                    <button class="btn btn-sm btn-outline-warning" onclick="resetearClave('${e.email}')">🔑 Resetear Clave</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarEmpleado('${docSnap.id}')">🗑️ Dar de Baja</button>
                </div>
            </td>
        </tr>`;
        });
    });
}


    window.verTelefonos = (nombre, listaTels) => {
    Swal.fire({
        title: `Contacto: ${nombre}`,
        html: `<p class="mt-3"><b>Números registrados:</b></p><p>${listaTels}</p>`,
        icon: 'info',
        confirmButtonColor: '#FF6600'
    });
};

window.resetearClave = async (email) => {
    const result = await Swal.fire({
        title: '¿Restablecer contraseña?',
        text: `Se enviará un correo a ${email} para que el asesor genere una nueva clave.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, enviar correo',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#FF6600'
    });

    if (result.isConfirmed) {
        try {
            await sendPasswordResetEmail(auth, email);
            Swal.fire("¡Correo Enviado!", "Dile al asesor que revise su bandeja de entrada (o spam).", "success");
        } catch (error) {
            console.error(error);
            Swal.fire("Error", "No se pudo enviar: " + error.message, "error");
        }
    }
};

    let telefonosTemporales = [];

    window.agregarTelALista = () => {
        const input = document.getElementById('emp_tel_input');
        const tel = input.value.trim();
        if (tel) {
            telefonosTemporales.push(tel);
            actualizarVistaPrevia();
            input.value = '';
        }
    };

    function actualizarVistaPrevia() {
        document.getElementById('lista_tels_previa').innerHTML = 
            telefonosTemporales.map(t => `<span class="badge bg-info text-dark me-1">${t}</span>`).join('');
    }

    // REGISTRO DE EMPLEADO (AUTH + FIRESTORE)
    document.getElementById('formEmpleado').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        
        if (telefonosTemporales.length === 0) return Swal.fire("Aviso", "Agrega al menos un teléfono", "warning");

        const email = document.getElementById('emp_email').value;
        const pass = document.getElementById('emp_pass').value;
        const nombre = document.getElementById('emp_nombre').value;

        try {
            // ACTIVAMOS EL BLOQUEO
            registrandoEmpleado = true;
            btn.disabled = true;
            btn.innerText = "Registrando...";
            
            // 1. Crear usuario en Firebase Authentication
            const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
            const newUser = userCredential.user;

            // 2. Guardar datos en Firestore usando el UID como nombre del documento
            await setDoc(doc(db, "empleados", newUser.uid), {
            uid: newUser.uid,
            nombre: nombre,
            email: email,
            telefonos: telefonosTemporales,
            rol: "empleado",
            fechaAlta: serverTimestamp()
        });


        // CERRAR SESIÓN SECUNDARIA INMEDIATAMENTE
        await secondaryAuth.signOut();

            Swal.fire("¡Listo!", `Asesor ${nombre} creado correctamente`, "success");
            
            telefonosTemporales = [];
            actualizarVistaPrevia();
            e.target.reset();

        } catch (error) {
            console.error(error);
            Swal.fire("Error", "No se pudo crear: " + error.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "Crear Acceso";
            // IMPORTANTE: Liberamos el bloqueo después de un pequeño delay
            setTimeout(() => { registrandoEmpleado = false; }, 1500);
        }
    });

    window.eliminarEmpleado = async (id) => {
        const result = await Swal.fire({
            title: '¿Dar de baja?',
            text: "¿Seguro desea eliminar este asesor? Esta acción no se puede deshacer.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Sí, eliminar'
        });

        if(result.isConfirmed) await deleteDoc(doc(db, "empleados", id));
    };



    window.editarTelefonos = async (uid, nombre) => {
    try {
        // 1. Obtener datos actuales del empleado
        const docRef = doc(db, "empleados", uid);
        const docSnap = await getDoc(docRef);
        const datos = docSnap.data();
        const telsActuales = datos.telefonos || [];

        // 2. Mostrar alerta para editar (separados por coma)
        const { value: nuevosTelsRaw } = await Swal.fire({
            title: `Editar teléfonos de ${nombre}`,
            input: 'text',
            inputValue: telsActuales.join(', '),
            inputLabel: 'Separa los números con una coma (,)',
            showCancelButton: true,
            confirmButtonText: 'Guardar Cambios',
            inputValidator: (value) => {
                if (!value) return '¡Debes ingresar al menos un teléfono!';
            }
        });

        // 3. Si el usuario guardó, actualizamos Firestore
        if (nuevosTelsRaw) {
            const listaLimpia = nuevosTelsRaw.split(',').map(t => t.trim()).filter(t => t !== "");
            
            await updateDoc(docRef, {
                telefonos: listaLimpia
            });

            Swal.fire("¡Actualizado!", "Los teléfonos han sido modificados.", "success");
        }
    } catch (error) {
        console.error("Error al editar:", error);
        Swal.fire("Error", "No se pudo actualizar los teléfonos", "error");
    }
};
</script>
</body>
</html>
